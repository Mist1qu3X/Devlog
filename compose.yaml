services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Dokploy}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in Dokploy}
      DEBUG: "False"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
